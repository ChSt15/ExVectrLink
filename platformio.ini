[env:exvectrlink_generic_esp8285_ota]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.22
;upload_port = exvectr_link.local
;platform = https://github.com/pioarduino/platform-espressif8266/releases/download/stable/platform-espressif8266.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESPAsyncTCP
  ESP8266WiFi
build_flags =
  -DTARGET_GENERICESP8285
  ;-DENABLE_SBUS
  ;-DENABLE_FORCEWIFI
  -DENABLE_CRSF
  -std=gnu++2a
  -DNON32XFER_HANDLER
build_unflags =
  -std=gnu++17

