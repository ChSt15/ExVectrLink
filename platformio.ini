[env:exvectrlink_generic_esp8285_ota]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.22
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ESPAsyncTCP
	ESP8266WiFi
build_flags = 
	-DTARGET_GENERICESP8285
	-DENABLE_CRSF
	-std=gnu++2a
	-DNON32XFER_HANDLER
build_unflags = 
	-std=gnu++17
;platform_packages = platformio/tool-esptoolpy@^2.41100.0

