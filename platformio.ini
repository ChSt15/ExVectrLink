[env:esp32-pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = pico32 ; change to pico32 if you have the older PICO kit
framework     = arduino
monitor_speed = 115200
;upload_port  = /dev/ttyACM0
;upload_flags =
;  --before
;  no_reset
;  --after
;  no_reset
;  --no-stub            ; (optional) prevents baud‑rate change

[env:pico_via_ota]
;platform = espressif32
board = pico32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.184
;upload_port = 192.168.178.144
;upload_port = exvectr_link.local
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer