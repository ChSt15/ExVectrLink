; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-pico]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
;platform_packages = platformio/tool-esptoolpy@^2.41100.0

[env:exvectrlink_tx_module]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DTARGET_EXVECTRLINKTXMODULE
  -DENABLE_CRSF_INPUT
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

[env:exvectrlink_tx_module_diversity]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; PSRAM is deliberately left unconfigured (no psram_type, memory_type=qio_qspi,
; no BOARD_HAS_PSRAM). Octal PSRAM claims GPIO 33-37 for SPIIO4..7/SPIDQS, and
; this board wires radio A's DIO1 to GPIO 36 and its RX_EN to GPIO 35 -- with
; OPI enabled the DIO1 interrupt never fires and the RF switch never toggles.
; Nothing in this firmware allocates from PSRAM (no ps_malloc/heap_caps calls,
; internal SRAM sits under 20% used), so there is nothing to give up.
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DTARGET_EXVECTRLINKTXMODULEDIVERSITY
  -DENABLE_CRSF_INPUT
  -D ARDUINO_USB_CDC_ON_BOOT=1

