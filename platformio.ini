[env:esp32-pico]
platform = espressif8266
board         = esp8285 ; change to pico32 if you have the older PICO kit
framework     = arduino
monitor_speed = 115200

[env:exvectrlink_controller_usb]
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
;monitor_port = /dev/ttyACM1
upload_speed = 921600
;upload_protocol = espota
;upload_port = 192.168.178.93
;upload_port = exvectr_link.local
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
build_flags =
  -DTARGET_EXVECTRCONTROLLER
	-D ARDUINO_USB_CDC_ON_BOOT=1
  -DENABLE_FORCEWIFI

