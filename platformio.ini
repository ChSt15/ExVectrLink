; ---------------------------------------------------------------------------------------------------------------
; ExVectrNetwork mode, TX module (Radiomaster Pocket, diversity board): node 2, router. Separate firmware, not a
; runtime mode: it builds only src_network/ (plus src/CRSF.cpp), so none of its code is in the FPV envs, and the FPV
; envs build only src/. USB CDC carries the network stream to the ground station; no debug text, no WiFi, no FHSS.
; The air side is a stub (see docs/network-mode.md). Pin map and PSRAM note: as exvectrlink_tx_module_diversity.
[env:exvectrlink_tx_module_network]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ExVectrNetwork
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
build_src_filter =
  -<*>
  +<../src_network/>
  +<CRSF.cpp>
build_flags =
  -DTARGET_EXVECTRLINKTXMODULEDIVERSITY
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -Isrc
  -Isrc_network
  -Ilib/ExVectrPackets/gen

; Host tests of the network-mode logic (pure C++, no Arduino): pio test -e native
; The sources are listed explicitly so nothing Arduino- or Core-dependent is compiled.
[env:native]
platform = native
test_framework = unity
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
test_build_src = yes
build_flags =
  -std=gnu++17 -Wall -Wextra -g
  -Isrc_network
  -Ilib/ExVectrNetwork/include
  -Ilib/ExVectrPackets/gen
build_src_filter =
  -<*>
  +<../src_network/NetCrsf.cpp>
  +<../src_network/NetworkRouter.cpp>
  +<../lib/ExVectrNetwork/src/wire/>
  +<../lib/ExVectrNetwork/src/link/>
  +<../lib/ExVectrNetwork/src/net/>
