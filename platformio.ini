; ---------------------------------------------------------------------------------------------------------------
; ExVectrNetwork mode (docs/network-mode.md). Separate firmwares, not a runtime mode: they build src_network/ plus
; the few src/ files they need (radio objects, FHSS instance, WiFi upload; the TX module also CRSF and the settings
; store), so none of their code is in the FPV envs, and the FPV envs build only src/ (default filter, which never
; reaches src_network/). Air link: FHSS with air profile v1 (lib/ExVectrLink AirProfile.hpp).
;
; TX module (Radiomaster Pocket, diversity board): node 2, router, sync master. USB CDC carries the network stream to
; the ground station; no debug text. Pin map and PSRAM note: as exvectrlink_tx_module_diversity. Flash over USB.
[env:exvectrlink_tx_module_network]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ExVectrNetwork
  ExVectrLink
  ExVectrData
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
build_src_filter =
  -<*>
  +<../src_network/NetCrsf.cpp>
  +<../src_network/NetworkRouter.cpp>
  +<../src_network/target/>
  +<../src_network/target_tx/>
  +<CRSF.cpp>
  +<SX1280.cpp>
  +<DatalinkSetup.cpp>
  +<DiversitySetup.cpp>
  +<FhssSetup.cpp>
  +<Settings.cpp>
  +<WifiUpload.cpp>
  +<WifiCredentials.cpp>
build_flags =
  -DTARGET_EXVECTRLINKTXMODULEDIVERSITY
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -Isrc
  -Isrc_network
  -Isrc
  -Isrc_network/target
  -Ilib/ExVectrPackets/gen

; Vehicle receiver, ESP8285 single radio (GenericEsp8266 pin map): node 3, router, sync follower. UART0 (Serial,
; GPIO 3/1) at 460800 8N1 is the network stream to the vehicle; no debug output (UART0 is the only full UART).
; Only the network stack: no CRSF, no FPV application layer. 160 MHz for margin in the FHSS slot task.
; Over-the-air (WiFi) upload as the FPV receiver: espota to upload_port (use --upload-port to override).
[env:exvectrlink_rx_network_esp8285]
platform = espressif8266
board = esp8285
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 460800
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.22
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP8266WiFi
  ExVectrNetwork
  ExVectrLink
build_src_filter =
  -<*>
  +<../src_network/RxRouter.cpp>
  +<../src_network/target/>
  +<../src_network/target_rx/>
  +<SX1280.cpp>
  +<DatalinkSetup.cpp>
  +<DiversitySetup.cpp>
  +<FhssSetup.cpp>
  +<WifiUpload.cpp>
  +<WifiCredentials.cpp>
build_flags =
  -DTARGET_GENERICESP8285
  -std=gnu++2a
  -DNON32XFER_HANDLER
  -Isrc
  -Isrc_network
  -Isrc
  -Isrc_network/target
  -Ilib/ExVectrPackets/gen
build_unflags =
  -std=gnu++17

; Same as exvectrlink_rx_network_esp8285 for the ESP8285 board WITH external PA and LNA (RX/TX enable pins 9/10,
; PA offset 19 dBm, board maximum 20 dBm), like the FPV env exvectrlink_generic_esp8285_pa_ota. The plain env does NOT
