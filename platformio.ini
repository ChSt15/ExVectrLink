; Host tests of the network-mode logic (pure C++, no Arduino): pio test -e native
; The sources are listed explicitly so nothing Arduino- or Core-dependent is compiled.
[env:native]
test_ignore = test_fhss
platform = native
test_framework = unity
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
test_build_src = yes
build_flags =
  -std=gnu++17 -Wall -Wextra -g
  -Isrc_network
  -Isrc
  -Ilib/ExVectrNetwork/include
  -Ilib/ExVectrLink/include
  -Ilib/ExVectrPackets/gen
build_src_filter =
  -<*>
  +<../src_network/NetCrsf.cpp>
  +<../src_network/NetworkRouter.cpp>
  +<../src_network/RxRouter.cpp>
  +<../lib/ExVectrNetwork/src/wire/>
  +<../lib/ExVectrNetwork/src/link/>
  +<../lib/ExVectrNetwork/src/net/>

; Host tests of the real FHSS class (lib/ExVectrLink) on fake radios and a fake clock: pio test -e native_fhss
; Needs C++20 (ExVectrCore concepts). Core's time source is provided by the test (Core::NowNs()).
[env:native_fhss]
platform = native
test_framework = unity
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
test_build_src = yes
test_filter = test_fhss
build_flags =
  -std=gnu++2a -Wall -Wextra -g
  -Itest/stubs
  -Ilib/ExVectrLink/include
  -Ilib/ExVectrCore/include
  -Ilib/ExVectrNetwork/include
  -Ilib/ExVectrHAL/include
build_src_filter =
  -<*>
  +<../lib/ExVectrLink/src/datalink/FHSS.cpp>
  +<../lib/ExVectrCore/src/task_types.cpp>
  +<../lib/ExVectrCore/src/scheduler2.cpp>
  +<../lib/ExVectrCore/src/print.cpp>
  +<../lib/ExVectrCore/src/time_source.cpp>
  +<../lib/ExVectrCore/src/clock_source.cpp>
  +<../lib/ExVectrNetwork/src/DatalinkI.cpp>
