[env:esp32-pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = pico32 ; change to pico32 if you have the older PICO kit
framework     = arduino
monitor_speed = 115200

[env:exvectrlink_controller_ota]
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.93
;upload_port = exvectr_link.local
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
build_flags =
  -DTARGET_EXVECTRCONTROLLER
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:exvectrlink_genericdiversity_ota]
board = pico32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.144
;upload_port = exvectr_link.local
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
build_flags =
  -DTARGET_GENERICDIVERSITY_ELRS